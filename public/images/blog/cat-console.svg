  <!-- D-pad -->
  <rect x="310" y="180" width="40" height="12" rx="2" fill="rgba(255,255,255,0.25)"/>
  <rect x="324" y="166" width="12" height="40" rx="2" fill="rgba(255,255,255,0.25)"/>
  <!-- Buttons -->
  <circle cx="470" cy="170" r="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <circle cx="490" cy="190" r="8" fill="none" stroke="rgba(249,115,22,0.6)" stroke-width="2"/>
  <circle cx="450" cy="190" r="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <circle cx="470" cy="210" r="8" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <!-- Analog sticks -->
  <circle cx="350" cy="230" r="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <circle cx="440" cy="230" r="14" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Circuit decorations -->
