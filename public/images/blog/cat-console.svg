  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Controller body -->
  <path d="M280 160 Q280 130 310 130 L490 130 Q520 130 520 160 L520 230 Q520 280 480 300 L460 310 Q440 320 430 300 L420 260 L380 260 L370 300 Q360 320 340 310 L320 300 Q280 280 280 230 Z"
