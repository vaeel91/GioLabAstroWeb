<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Microscope -->
  <g transform="translate(400, 200)">
    <!-- Base -->
    <rect x="-60" y="100" width="120" height="16" rx="4" fill="rgba(255,255,255,0.25)"/>
    <!-- Column -->
    <rect x="-8" y="-60" width="16" height="160" rx="4" fill="rgba(255,255,255,0.2)"/>
    <!-- Arm -->
    <path d="M8 -20 L80 -20 L80 0 L40 0 L40 40 L30 40 L30 0 L8 0 Z" fill="rgba(255,255,255,0.2)"/>
    <!-- Eyepiece -->
    <rect x="70" y="-50" width="20" height="30" rx="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="80" cy="-55" r="10" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <!-- Objective lens -->
    <rect x="30" y="40" width="20" height="24" rx="3" fill="rgba(255,255,255,0.3)"/>
    <!-- Stage -->
    <rect x="-40" y="68" width="80" height="8" rx="2" fill="rgba(255,255,255,0.25)"/>
    <!-- PCB on stage -->
    <rect x="-25" y="56" width="50" height="12" rx="2" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Tiny components on PCB -->
    <rect x="-15" y="59" width="6" height="3" rx="0.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="-3" y="59" width="4" height="3" rx="0.5" fill="rgba(255,255,255,0.3)"/>
    <rect x="8" y="59" width="8" height="3" rx="0.5" fill="rgba(255,255,255,0.3)"/>
  </g>
  <!-- Solder iron -->
  <g transform="translate(260, 260) rotate(-45)" opacity="0.3">
    <rect x="0" y="-4" width="80" height="8" rx="4" fill="white"/>
    <polygon points="80,-2 100,0 80,2" fill="white"/>
  </g>
  <!-- Sparkle effect -->
  <g opacity="0.4">
    <circle cx="530" cy="260" r="2" fill="white"/>
    <circle cx="540" cy="248" r="1.5" fill="white"/>
    <circle cx="550" cy="256" r="1" fill="white"/>
  </g>
  <!-- Circuit decorations -->
  <g opacity="0.1" stroke="white" stroke-width="1" fill="none">
    <path d="M50 50 h40 v30 h30 v-20 h50"/>
    <path d="M50 350 h60 v-40 h40 v20 h30"/>
    <path d="M650 80 h50 v50 h40"/>
    <path d="M680 320 h40 v-30 h30"/>
    <circle cx="90" cy="50" r="3" fill="white"/>
    <circle cx="170" cy="60" r="3" fill="white"/>
    <circle cx="700" cy="80" r="3" fill="white"/>
  </g>
</svg>
