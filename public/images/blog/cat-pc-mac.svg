      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#1340a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Laptop base -->
  <path d="M200 300 L600 300 L640 340 L160 340 Z" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Laptop screen -->
  <rect x="230" y="80" width="340" height="220" rx="10" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  <rect x="248" y="96" width="304" height="186" rx="4" fill="rgba(255,255,255,0.1)"/>
  <!-- Terminal/code suggestion -->
  <rect x="268" y="116" width="80" height="6" rx="3" fill="rgba(249,115,22,0.5)"/>
  <rect x="268" y="130" width="120" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="268" y="144" width="180" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="268" y="158" width="100" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="268" y="172" width="150" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
  <rect x="268" y="186" width="60" height="6" rx="3" fill="rgba(249,115,22,0.3)"/>
  <!-- Trackpad -->
  <rect x="360" y="306" width="80" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Circuit decorations -->
  <g opacity="0.08" stroke="white" stroke-width="1" fill="none">
    <path d="M50 50 h40 v30 h30 v-20 h50"/>
    <path d="M50 350 h60 v-40 h40"/>
    <path d="M680 80 h40 v50 h30"/>
    <path d="M700 320 h40 v-30"/>
    <circle cx="90" cy="50" r="3" fill="white"/>
    <circle cx="720" cy="80" r="3" fill="white"/>
  </g>
</svg>
