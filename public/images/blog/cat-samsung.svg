<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#1340a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Samsung-style phone -->
  <rect x="310" y="50" width="180" height="300" rx="24" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
  <rect x="326" y="70" width="148" height="240" rx="4" fill="rgba(255,255,255,0.1)"/>
  <!-- Camera module -->
  <rect x="340" y="85" width="60" height="22" rx="11" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="358" cy="96" r="5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="382" cy="96" r="5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- AMOLED display effect -->
  <rect x="340" y="115" width="120" height="60" rx="6" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1"/>
  <rect x="340" y="185" width="120" height="40" rx="6" fill="rgba(255,255,255,0.05)"/>
  <rect x="340" y="235" width="80" height="20" rx="4" fill="rgba(255,255,255,0.05)"/>
  <!-- Circuit decorations -->
  <g opacity="0.08" stroke="white" stroke-width="1" fill="none">
    <path d="M50 50 h40 v30 h30 v-20 h50"/>
    <path d="M50 350 h60 v-40 h40 v20 h30"/>
    <path d="M650 80 h50 v50 h40"/>
    <path d="M680 300 h40 v-30 h30"/>
    <circle cx="90" cy="50" r="3" fill="white"/>
    <circle cx="170" cy="60" r="3" fill="white"/>
    <circle cx="110" cy="340" r="3" fill="white"/>
    <circle cx="700" cy="80" r="3" fill="white"/>
    <circle cx="750" cy="270" r="3" fill="white"/>
  </g>
</svg>
