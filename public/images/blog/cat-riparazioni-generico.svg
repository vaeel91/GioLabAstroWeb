<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#1340a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Wrench and screwdriver crossed -->
  <g transform="translate(400, 200)">
    <!-- Wrench -->
    <g transform="rotate(-30)">
      <rect x="-8" y="-100" width="16" height="200" rx="4" fill="rgba(255,255,255,0.2)"/>
      <path d="M-18 -100 Q0 -120 18 -100 L12 -80 L-12 -80 Z" fill="rgba(255,255,255,0.25)"/>
    </g>
    <!-- Screwdriver -->
    <g transform="rotate(30)">
      <rect x="-6" y="-100" width="12" height="160" rx="3" fill="rgba(255,255,255,0.2)"/>
      <rect x="-10" y="60" width="20" height="40" rx="5" fill="rgba(255,255,255,0.25)"/>
      <rect x="-3" y="-120" width="6" height="24" rx="1" fill="rgba(249,115,22,0.5)"/>
    </g>
  </g>
  <!-- Gear -->
  <g transform="translate(400, 200)" opacity="0.15">
    <circle r="40" fill="none" stroke="white" stroke-width="3"/>
    <circle r="15" fill="none" stroke="white" stroke-width="3"/>
    <g>
      <rect x="-5" y="-50" width="10" height="20" rx="2" fill="white"/>
      <rect x="-5" y="30" width="10" height="20" rx="2" fill="white"/>
      <rect x="-50" y="-5" width="20" height="10" rx="2" fill="white"/>
      <rect x="30" y="-5" width="20" height="10" rx="2" fill="white"/>
    </g>
  </g>
  <!-- Circuit decorations -->
  <g opacity="0.08" stroke="white" stroke-width="1" fill="none">
    <path d="M50 50 h40 v30 h30 v-20 h50"/>
    <path d="M50 350 h60 v-40 h40 v20 h30"/>
    <path d="M650 80 h50 v50 h40"/>
    <path d="M680 300 h40 v-30 h30"/>
    <circle cx="90" cy="50" r="3" fill="white"/>
    <circle cx="170" cy="60" r="3" fill="white"/>
    <circle cx="700" cy="80" r="3" fill="white"/>
  </g>
</svg>
